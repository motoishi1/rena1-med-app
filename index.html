<title>腎機能別 薬剤確認</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#17202a;background:#f5f7f8}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:720px;margin:auto;padding:16px 14px 40px}
h1{font-size:22px;margin:8px 0 4px}.sub{color:#64748b;font-size:13px;margin-bottom:18px}
.card{background:white;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000d}
label{display:block;font-size:13px;font-weight:600;margin:10px 0 5px}
input,select{width:100%;font-size:16px;padding:11px;border:1px solid #cbd5e1;border-radius:10px;background:white}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{border:0;border-radius:11px;padding:12px 14px;font-size:15px;font-weight:700;cursor:pointer}
.primary{background:#0f766e;color:white;width:100%;margin-top:12px}.secondary{background:#e2e8f0;color:#1e293b}
.result{font-size:28px;font-weight:800}.unit{font-size:14px;font-weight:500;color:#64748b}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e6fffb;color:#115e59;font-size:12px;font-weight:700}
.warn{background:#fff7ed;border-left:4px solid #f59e0b;padding:12px;border-radius:8px;margin-top:12px}
.danger{background:#fef2f2;border-left:4px solid #ef4444;padding:12px;border-radius:8px;margin-top:12px}
.ok{background:#f0fdf4;border-left:4px solid #22c55e;padding:12px;border-radius:8px;margin-top:12px}
.searchrow{display:flex;gap:8px}.searchrow input{flex:1}.searchrow button{white-space:nowrap}
.list{margin-top:8px;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
.item{padding:11px 12px;border-bottom:1px solid #e2e8f0;cursor:pointer;background:#fff}
.item:last-child{border-bottom:0}.item small{display:block;color:#64748b;margin-top:3px}
.muted{color:#64748b;font-size:12px;line-height:1.6}
pre{white-space:pre-wrap;font-family:inherit;line-height:1.6;margin:8px 0 0}
.hidden{display:none}.footer{font-size:11px;color:#64748b;line-height:1.6;margin-top:18px}
@media(max-width:430px){.row{grid-template-columns:1fr}.wrap{padding-left:10px;padding-right:10px}}
</style>
</head>
<body>
<div class="wrap">
<h1>腎機能別 薬剤確認</h1>
<div class="sub">Cockcroft–Gault式によるCLcr確認用プロトタイプ</div>

<div class="card">
  <h2 style="font-size:17px;margin:0 0 8px">1. 患者情報</h2>
  <div class="row">
    <div><label for="sex">性別</label><select id="sex"><option value="male">男性</option><option value="female">女性</option></select></div>
    <div><label for="age">年齢</label><input id="age" type="number" min="1" max="120" placeholder="例：70"></div>
  </div>
  <div class="row">
    <div><label for="weight">実測体重（kg）</label><input id="weight" type="number" min="1" step="0.1" placeholder="例：60.0"></div>
    <div><label for="cr">血清Cr（mg/dL）</label><input id="cr" type="number" min="0.01" step="0.01" placeholder="例：1.20"></div>
  </div>
  <label for="hd">血液透析</label>
  <select id="hd"><option value="no">なし</option><option value="yes">あり</option></select>
  <button class="primary" onclick="calc()">CLcrを計算</button>
</div>

<div id="calcCard" class="card hidden">
  <h2 style="font-size:17px;margin:0 0 8px">2. 腎機能</h2>
  <div id="clcr" class="result"></div>
  <div id="band" style="margin-top:7px"></div>
  <div class="muted" style="margin-top:8px">※実測体重を用いたCockcroft–Gault式。女性は0.85を乗じます。</div>
</div>

<div class="card">
  <h2 style="font-size:17px;margin:0 0 8px">3. 薬剤を検索</h2>
  <div class="searchrow">
    <input id="q" placeholder="一般名・商品名で検索" oninput="searchDrug()">
    <button class="secondary" onclick="clearSearch()">クリア</button>
  </div>
  <div id="list" class="list hidden"></div>
</div>

<div id="drugCard" class="card hidden">
  <div id="drugTitle"></div>
  <div id="drugMeta" class="muted" style="margin-top:8px"></div>
  <div id="drugResult" style="margin-top:14px"></div>
</div>

<div class="footer">
  本アプリはExcel「腎機能別、注意が必要な医薬品(セントラルver).xlsx」を元にした試作版です。
  薬剤投与量の最終判断には、添付文書・院内基準・最新の医薬品情報等を必ず確認してください。
</div>
</div>

function val(id){return document.getElementById(id).value}
function calc(){
  const sex=val("sex"), age=parseFloat(val("age")), wt=parseFloat(val("weight")), cr=parseFloat(val("cr"));
  if(!age || !wt || !cr || cr<=0){alert("年齢・実測体重・血清Crを入力してください。");return}
  let ccr=((140-age)*wt)/(72*cr);
  if(sex==="female") ccr*=0.85;
  window.currentCcr=ccr;
  document.getElementById("calcCard").classList.remove("hidden");
  document.getElementById("clcr").innerHTML=ccr.toFixed(1)+' <span class="unit">mL/min</span>';
  document.getElementById("band").innerHTML='<span class="badge">'+(val("hd")==="yes" ? "HD" : band(ccr))+'</span>';
  if(val("q")) searchDrug();
  if(window.selectedDrug) showDrug(window.selectedDrug);
}
function band(ccr){
  if(ccr>60)return "Ccr > 60";
  if(ccr>=50)return "Ccr 50–60";
  if(ccr>=40)return "Ccr 40–49";
  if(ccr>=30)return "Ccr 30–39";
  if(ccr>=20)return "Ccr 20–29";
  return "Ccr <20（Excel「10」区分）";
}
function keyFor(ccr){
  if(ccr>60)return "gt60";
  if(ccr>=50)return "50";
  if(ccr>=40)return "40";
  if(ccr>=30)return "30";
  if(ccr>=20)return "20";
  return "10";
}
function searchDrug(){
  const q=val("q").trim().toLowerCase(), list=document.getElementById("list");
  if(!q){list.classList.add("hidden");list.innerHTML="";return}
  const hits=drugs.filter(d=>(d.generic_name||"").toLowerCase().includes(q)||(d.product_name||"").toLowerCase().includes(q)).slice(0,30);
  list.innerHTML=hits.length?hits.map((d,i)=>`<div class="item" onclick="selectDrug('${d.drug_id}')"><b>${esc(d.generic_name||"")}</b>${d.product_name?`<small>${esc(d.product_name)}</small>`:""}</div>`).join(""):'<div class="item">該当する薬剤がありません</div>';
  list.classList.remove("hidden");
}
function selectDrug(id){
  window.selectedDrug=drugs.find(d=>d.drug_id===id); showDrug(window.selectedDrug);
}
function showDrug(d){
  if(!d)return;
  document.getElementById("drugCard").classList.remove("hidden");
  document.getElementById("drugTitle").innerHTML=`<h2 style="font-size:19px;margin:0">${esc(d.generic_name||"")}</h2>${d.product_name?`<div style="margin-top:3px">${esc(d.product_name)}</div>`:""}`;
  document.getElementById("drugMeta").innerHTML=`分類：${esc(d.category||"")}　／　透析性：${esc(d.dialyzability||"記載なし")}<br>常用量：${esc(d.usual_dose||"記載なし")}`;
  const box=document.getElementById("drugResult");
  if(window.currentCcr==null){box.innerHTML='<div class="warn">先に患者情報を入力してCLcrを計算してください。</div>';return}
  if(d.renal_indicator==="eGFR"){
    box.innerHTML=`<div class="warn"><b>⚠️ 腎機能指標：eGFR</b><br>この薬剤の腎機能評価にはeGFRが用いられます。<br><br>本アプリではeGFRは算出せず、CLcrは参考値として表示しています。</div><div class="muted" style="margin-top:10px">表示されたCLcr：${window.currentCcr.toFixed(1)} mL/min</div>`;
    return;
  }
  const k=val("hd")==="yes"?"HD":keyFor(window.currentCcr);
  let text=d.recommendations?.[k];
  // Blank cells are intentionally not auto-filled here; this preserves the Excel source.
  if(!text) text="この腎機能区分の記載はExcel上で空欄です。前後の区分だけで判断せず、原資料を確認してください。";
  const cls=/禁忌|避ける/.test(text)?"danger":"ok";
  box.innerHTML=`<div class="${cls}"><b>${k==="HD"?"HD":band(window.currentCcr)}</b><pre>${esc(text)}</pre></div><div class="muted" style="margin-top:10px">CLcr：${window.currentCcr.toFixed(1)} mL/min</div>`;
}
function clearSearch(){document.getElementById("q").value="";document.getElementById("list").classList.add("hidden");document.getElementById("list").innerHTML=""}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
